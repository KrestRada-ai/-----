        if (point) current.points.push(point);
        point = null;
        if (current.title || current.points.length) sections.push(current);
        current = { title: line, points: [] };
        continue;
      }
      const pm = line.match(pointRe);
      if (pm) {
        if (point) current.points.push(point);
        point = { n: pm[1], text: pm[2], items: [] };
      } else if (point && /;$/.test(line)) {
        point.items.push(line);
      } else if (point) {
        point.text += ' ' + line;
      }
    }
    if (point) current.points.push(point);
    sections.push(current);

    const main = document.getElementById('cnMain');
    const toc = document.getElementById('cnToc');

    const tocList = document.createElement('ul');
    tocList.className = 'cn-toc-list';
    const tocTitle = document.createElement('h2');
    tocTitle.className = 'cn-toc-title';
    tocTitle.textContent = 'Оглавление';
    toc.append(tocTitle, tocList);

    sections.forEach((section, idx) => {
      const sec = document.createElement('section');
      sec.className = 'cn-section';
      sec.id = `cn-sec-${idx}`;
      const h2 = document.createElement('h2');
      h2.innerHTML = applyNbsp(section.title);
      sec.appendChild(h2);

      section.points.forEach(p => {
        const art = document.createElement('article');
        art.className = 'cn-point';
        art.tabIndex = 0;
        const pEl = document.createElement('p');
        pEl.innerHTML = `<span class="cn-point-num">${p.n}.</span>${applyNbsp(p.text)}`;
        art.appendChild(pEl);

        if (p.items.length) {
          const ul = document.createElement('ul');
          p.items.forEach(it => {
            const li = document.createElement('li');
            li.innerHTML = applyNbsp(it);
            ul.appendChild(li);
          });
          art.appendChild(ul);
        }

        const btn = document.createElement('button');
        btn.className = 'cn-btn cn-copy-point';
        btn.type = 'button';
        btn.textContent = '📋 Копировать пункт';
        btn.title = 'Копировать пункт';
        btn.addEventListener('click', async () => {
          const txt = art.innerText.replace('📋 Копировать пункт', '').trim();
          await navigator.clipboard.writeText(txt);
          const old = btn.textContent; btn.textContent = '✅ Скопировано!';
          setTimeout(() => btn.textContent = old, 1200);
        }, { passive: true });
        art.appendChild(btn);

        sec.appendChild(art);
      });
      main.appendChild(sec);

      const first = section.points[0]?.n || '—';
      const last = section.points.at(-1)?.n || '—';
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.className = 'cn-toc-btn';
      b.type = 'button';
      b.dataset.target = sec.id;
      b.innerHTML = `${section.title}<br><small>п.&nbsp;${first}–${last}</small>`;
      b.addEventListener('click', () => {
        document.getElementById(sec.id)?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      }, { passive: true });
      li.appendChild(b);
      tocList.appendChild(li);
    });

    const menuToggle = document.getElementById('cnMenuToggle');
    menuToggle.addEventListener('click', () => {
      const open = toc.classList.toggle('is-open');
      menuToggle.setAttribute('aria-expanded', String(open));
    }, { passive: true });

    const observer = new IntersectionObserver((entries) => {
      const vis = entries.filter(e => e.isIntersecting).sort((a,b) => b.intersectionRatio - a.intersectionRatio)[0];
      if (!vis) return;
      document.querySelectorAll('.cn-toc-btn').forEach(btn => btn.classList.toggle('is-active', btn.dataset.target === vis.target.id));
    }, { rootMargin: '-20% 0px -70% 0px', threshold: [0.2, 0.6] });
    document.querySelectorAll('.cn-section').forEach(s => observer.observe(s));

    const norm = s => s.toLowerCase().replace(/ё/g,'е').replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
    const aliases = { 'ниит': 'научно исследовательского института транспорта', 'нтр': 'научно технологического развития', 'ии': 'искусственного интеллекта' };
    let marks = [], idx = -1;

    function clearMarks() {
      marks.forEach(m => {
        const p = m.parentNode;
        if (!p) return;
        p.replaceChild(document.createTextNode(m.textContent), m);
        p.normalize();
      });
      marks = []; idx = -1;
      document.getElementById('cnCounter').textContent = '0 из 0';
    }

    function highlight(q) {
      clearMarks();
      if (!q.trim()) return;
      const query = aliases[norm(q)] || q;
      const needle = norm(query);
      const walker = document.createTreeWalker(main, NodeFilter.SHOW_TEXT, {
        acceptNode(node) { return node.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; }
      });
      const targets = [];
      while (walker.nextNode()) targets.push(walker.currentNode);
      for (const n of targets) {
        const val = n.nodeValue;
        const nval = norm(val);
        const pos = nval.indexOf(needle);
        if (pos < 0) continue;
        const rawPos = val.toLowerCase().indexOf(query.toLowerCase().split(' ')[0]);
        if (rawPos < 0) continue;
        const r = document.createRange();
        r.setStart(n, rawPos); r.setEnd(n, Math.min(val.length, rawPos + query.length));
        const m = document.createElement('mark'); m.className = 'cn-mark';
        r.surroundContents(m); marks.push(m);
      }
      if (marks.length) goto(0);
      document.getElementById('cnCounter').textContent = `${marks.length ? 1 : 0} из ${marks.length}`;
    }

    function goto(next) {
      if (!marks.length) return;
      marks.forEach(m => m.classList.remove('is-current'));
      idx = (next + marks.length) % marks.length;
      marks[idx].classList.add('is-current');
      marks[idx].scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      document.getElementById('cnCounter').textContent = `${idx + 1} из ${marks.length}`;
    }

    const search = document.getElementById('cnSearch');
    search.addEventListener('input', (e) => highlight(e.target.value));
    search.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); goto(idx + (e.shiftKey ? -1 : 1)); }
    });
    document.getElementById('cnNext').addEventListener('click', () => goto(idx + 1), { passive: true });
    document.getElementById('cnPrev').addEventListener('click', () => goto(idx - 1), { passive: true });

    document.querySelectorAll('[data-size]').forEach(btn => btn.addEventListener('click', () => {
      document.documentElement.style.setProperty('--cn-font-size', btn.dataset.size + 'px');
      document.querySelectorAll('[data-size]').forEach(b => b.classList.remove('is-active'));
      btn.classList.add('is-active');
    }, { passive: true }));

    const selBtn = document.getElementById('cnSelectionCopy');
    let selected = '';
    document.addEventListener('mouseup', (e) => {
      const sel = window.getSelection();
      selected = sel ? sel.toString().trim() : '';
      if (!selected) { selBtn.style.display = 'none'; return; }
      selBtn.style.display = 'block';
      selBtn.style.left = e.clientX + 'px';
      selBtn.style.top = e.clientY + 'px';
    }, { passive: true });
    selBtn.addEventListener('click', async () => {
      if (!selected) return;
      await navigator.clipboard.writeText(selected);
      const old = selBtn.textContent; selBtn.textContent = '✅ Скопировано!';
      setTimeout(() => { selBtn.textContent = old; selBtn.style.display = 'none'; }, 900);
    }, { passive: true });

    const progress = document.getElementById('cnProgress');
    document.addEventListener('scroll', () => {
      const max = document.documentElement.scrollHeight - innerHeight;
      progress.style.width = `${max > 0 ? (scrollY / max) * 100 : 0}%`;
    }, { passive: true });
  </script>
</body>
</html>
